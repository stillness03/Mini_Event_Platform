services:
  # --- INFRASTRUCTURE (DATABASES) ---
  db-postgres:
    image: postgres:15
    container_name: db-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: main_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-mongo:
    image: mongo:7
    container_name: db-mongo
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    logging:
      driver: "local"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-redis:
    image: redis:7
    container_name: db-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MICROSERVICES ---
  user-service:
    build:
      context: .
      dockerfile: services/user-service/deploy/Dockerfile
    container_name: user-service
    env_file:
      - services/user-service/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db-postgres:5432/users_db
      - ALEMBIC_DATABASE_URL=postgresql+psycopg://postgres:password@db-postgres:5432/users_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db-postgres:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/deploy/Dockerfile
    container_name: payment-service
    env_file:
      - services/payment-service/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db-postgres:5432/payment_db
      - ALEMBIC_DATABASE_URL=postgresql+psycopg://postgres:password@db-postgres:5432/payment_db
#      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      db-postgres:
        condition: service_healthy

  event-service:
    build:
      context: .
      dockerfile: services/event-service/deploy/Dockerfile
    container_name: event-service
    env_file:
      - services/event-service/.env
    environment:
      - MONGO_URI=mongodb://db-mongo:27017
      - REDIS_HOST=db-redis
      - REDIS_PORT=6379
    depends_on:
      db-mongo:
        condition: service_healthy
      db-redis:
        condition: service_healthy

  sub-service:
    build:
      context: .
      dockerfile: services/sub-service/deploy/Dockerfile
    container_name: sub-service
    env_file:
      - services/sub-service/.env
    environment:
      - SUB_DATABASE_URL=postgresql+asyncpg://postgres:password@db-postgres:5432/sub_db
      - ALEMBIC_DATABASE_URL=postgresql+psycopg://postgres:password@db-postgres:5432/sub_db
      - EVENT_SERVICE_URL=http://event-service:8000
    depends_on:
      db-postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/deploy/Dockerfile
    container_name: gateway
    env_file:
      - services/gateway/.env
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - PAYMENT_SERVICE_URL=http://payment-service:8003
      - EVENT_SERVICE_URL=http://event-service:8000
      - SUB_SERVICE_URL=http://sub-service:8002
    depends_on:
      - user-service
      - payment-service
      - event-service
      - sub-service

# --- TOP-LEVEL VOLUMES ---
volumes:
  postgres_data:
  mongo_data:
  redis_data:

# --- TOP-LEVEL NETWORKS ---
networks:
  default:
    name: event-platform-network