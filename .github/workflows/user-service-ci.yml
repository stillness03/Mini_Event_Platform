name: User Service CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/user-service/**'
  pull_request:
    paths:
      - 'services/user-service/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/user-service/requirements.txt
          pip install pytest pytest-asyncio httpx faker

      - name: Run tests
        working-directory: services/user-service
        env:
          APP_NAME: "user-service-test"
          APP_ENV: "development"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
          PYTHONPATH: .
        run: pytest

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          docker build -t user-service:test \
            -f services/user-service/deploy/Dockerfile \
            services/user-service/