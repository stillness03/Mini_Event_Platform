name: Payment Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "services/payment-service/**"
      - ".github/workflows/payments-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/payment-service/**"
      - ".github/workflows/payments-service-ci.yml"

env:
  PYTHON_VERSION: "3.12"
  SERVICE_PATH: services/payment-service
  IMAGE_NAME: mini-event/payment-service

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check ${{ env.SERVICE_PATH }}

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/payment_test
      DATABASE_URL_SYNC: postgresql+psycopg2://test:test@localhost:5432/payment_test
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_PUBLIC_KEY: pk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_fake
      STRIPE_SUCCESS_URL: https://example.com/success
      STRIPE_CANCEL_URL: https://example.com/cancel
      EVENTS_BASE_URL: http://localhost:8001

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_PATH }}/requirements.txt

      - name: Install shared package
        run: pip install -e ../../shared

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest --tb=short -q --asyncio-mode=auto
  