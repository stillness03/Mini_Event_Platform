name: Payment Service CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'services/payment-service/**'
  pull_request:
    paths:
      - 'services/payment-service/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_payment_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/payment-service/requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx

      - name: Run Pytest
        working-directory: services/payment-service
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
          EVENTS_BASE_URL: "http://localhost:8001"
          STRIPE_SUCCESS_URL: "http://localhost:3000/success"
          STRIPE_CANCEL_URL: "http://localhost:3000/cancel"
          PYTHONPATH: .
        run: pytest